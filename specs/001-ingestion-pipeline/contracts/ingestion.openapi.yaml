openapi: 3.1.0
info:
  title: Radar Público Internal Ingestion API
  version: 0.2.0
  description: Draft contract reflecting approved EDITION / ALL / BACKFILL business decisions. Not implemented.
servers:
  - url: /internal/v1
security:
  - serviceBearer: []
paths:
  /source-runs:
    post:
      operationId: startSourceRun
      summary: Start a LIVE or BACKFILL source run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSourceRun'
      responses:
        '201':
          description: Run started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceRun'
        '401': { description: Unauthenticated }
        '403': { description: Source not authorized }
        '422': { description: Invalid mode or range }
  /source-runs/{runId}:
    get:
      operationId: getSourceRun
      summary: Retrieve progress and failure counters
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceRun'
        '404': { description: Not found }
  /source-runs/{runId}/editions:
    post:
      operationId: ingestEditionManifest
      summary: Idempotently register an edition with one or more logical documents
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditionManifest'
      responses:
        '200': { description: Existing edition or document versions observed }
        '201': { description: New edition or document versions registered }
        '401': { description: Unauthenticated }
        '409': { description: Run state conflict }
        '422': { description: Invalid edition or document manifest }
  /document-versions/{versionId}/complete:
    post:
      operationId: completeDocumentUpload
      summary: Confirm storage object integrity and SHA-256
      parameters:
        - name: versionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Stored or already completed }
        '409': { description: Missing object or checksum mismatch }
  /source-runs/{runId}/finish:
    post:
      operationId: finishSourceRun
      summary: Finish a run without concealing partial coverage
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [SUCCEEDED, PARTIAL, FAILED, CANCELLED] }
                errorCode: { type: [string, 'null'] }
      responses:
        '200': { description: Run finalized and coverage updated }
        '409': { description: Outstanding items require reconciliation }
  /sources/{sourceId}/coverage:
    get:
      operationId: getSourceCoverage
      summary: Get verified historical intervals and gaps
      parameters:
        - name: sourceId
          in: path
          required: true
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Coverage intervals
          content:
            application/json:
              schema:
                type: object
                required: [intervals]
                properties:
                  intervals:
                    type: array
                    items:
                      $ref: '#/components/schemas/CoverageInterval'
components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string }
  schemas:
    StartSourceRun:
      type: object
      additionalProperties: false
      required: [sourceId, trigger, mode]
      properties:
        sourceId: { type: string }
        trigger: { type: string, enum: [SCHEDULED, MANUAL, RETRY] }
        mode: { type: string, enum: [LIVE, BACKFILL] }
        range:
          anyOf:
            - $ref: '#/components/schemas/DateRange'
            - type: 'null'
          description: Required for BACKFILL; forbidden for LIVE (application validation).
    DateRange:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
    SourceRun:
      type: object
      required: [runId, sourceId, mode, status]
      properties:
        runId: { type: string }
        sourceId: { type: string }
        mode: { type: string, enum: [LIVE, BACKFILL] }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, PARTIAL, FAILED, CANCELLED] }
        range:
          anyOf:
            - $ref: '#/components/schemas/DateRange'
            - type: 'null'
        discoveredEditions: { type: integer, minimum: 0 }
        storedDocuments: { type: integer, minimum: 0 }
        failedDocuments: { type: integer, minimum: 0 }
        correlationId: { type: string }
    EditionManifest:
      type: object
      additionalProperties: false
      required: [sourceId, canonicalEditionKey, title, officialUrl, documents]
      properties:
        sourceId: { type: string }
        canonicalEditionKey: { type: string, minLength: 1 }
        editionNumber: { type: [string, 'null'] }
        title: { type: string, minLength: 1 }
        publishedAt: { type: [string, 'null'], format: date-time }
        officialUrl: { type: string, format: uri }
        documents:
          type: array
          items:
            $ref: '#/components/schemas/EditionDocument'
    EditionDocument:
      type: object
      additionalProperties: false
      required: [canonicalDocumentKey, role, officialUrl, sha256, sizeBytes, mimeType]
      properties:
        canonicalDocumentKey: { type: string, minLength: 1 }
        role: { type: string, enum: [MAIN, SUPPLEMENT, ANNEX, OTHER] }
        title: { type: [string, 'null'] }
        officialUrl: { type: string, format: uri }
        sha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
        sizeBytes: { type: integer, minimum: 1 }
        mimeType: { type: string, const: application/pdf }
    CoverageInterval:
      type: object
      required: [from, to, status]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        status: { type: string, enum: [COMPLETE, PARTIAL, UNAVAILABLE] }
        reason: { type: [string, 'null'] }
        lastRunId: { type: [string, 'null'] }
