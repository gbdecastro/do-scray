openapi: 3.1.0
info:
  title: Radar Público Internal Ingestion API
  version: 0.3.0
  description: Draft LIVE-only ingestion contract. Edition + all eligible documents + start from activation baseline. Not implemented.
servers:
  - url: /internal/v1
security:
  - serviceBearer: []
paths:
  /source-runs:
    post:
      operationId: startSourceRun
      summary: Start current collection for an activated source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sourceId, trigger]
              properties:
                sourceId: { type: string }
                trigger: { type: string, enum: [SCHEDULED, MANUAL, RETRY] }
      responses:
        '201':
          description: Run started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceRun'
        '401': { description: Unauthenticated }
        '403': { description: Source not authorized }
  /source-runs/{runId}:
    get:
      operationId: getSourceRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceRun'
        '404': { description: Not found }
  /source-runs/{runId}/editions:
    post:
      operationId: ingestEditionManifest
      summary: Register an edition and its documents idempotently
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditionManifest'
      responses:
        '200': { description: Already observed }
        '201': { description: New edition or version }
        '401': { description: Unauthenticated }
        '409': { description: Invalid run state }
        '422': { description: Invalid manifest }
  /document-versions/{versionId}/complete:
    post:
      operationId: completeDocumentUpload
      parameters:
        - name: versionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Object integrity confirmed }
        '409': { description: Missing object or hash mismatch }
  /source-runs/{runId}/finish:
    post:
      operationId: finishSourceRun
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [SUCCEEDED, PARTIAL, FAILED, CANCELLED] }
                errorCode: { type: [string, 'null'] }
      responses:
        '200': { description: Run finalized }
        '409': { description: Pending ingestion items }
components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string }
  schemas:
    SourceRun:
      type: object
      required: [runId, sourceId, status]
      properties:
        runId: { type: string }
        sourceId: { type: string }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, PARTIAL, FAILED, CANCELLED] }
        discoveredEditions: { type: integer, minimum: 0 }
        storedDocuments: { type: integer, minimum: 0 }
        failedDocuments: { type: integer, minimum: 0 }
        correlationId: { type: string }
    EditionManifest:
      type: object
      additionalProperties: false
      required: [sourceId, canonicalEditionKey, title, officialUrl, documents]
      properties:
        sourceId: { type: string }
        canonicalEditionKey: { type: string, minLength: 1 }
        editionNumber: { type: [string, 'null'] }
        title: { type: string, minLength: 1 }
        publishedAt: { type: [string, 'null'], format: date-time }
        officialUrl: { type: string, format: uri }
        documents:
          type: array
          items:
            $ref: '#/components/schemas/EditionDocument'
    EditionDocument:
      type: object
      additionalProperties: false
      required: [canonicalDocumentKey, role, officialUrl, sha256, sizeBytes, mimeType]
      properties:
        canonicalDocumentKey: { type: string, minLength: 1 }
        role: { type: string, enum: [MAIN, SUPPLEMENT, ANNEX, OTHER] }
        title: { type: [string, 'null'] }
        officialUrl: { type: string, format: uri }
        sha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
        sizeBytes: { type: integer, minimum: 1 }
        mimeType: { type: string, const: application/pdf }
